[project]
name = "krispin"
version = "0.1.0"
description = "Automatic detection of LED-board advertisements in football match footage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "ffmpeg-python>=0.2.0",
    "Pillow>=10.2.0",
    "rapidfuzz>=3.6.0",
    "tqdm>=4.66.0",
    # OCR
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
    # Visual embeddings
    "torch>=2.2.0",
    "open_clip_torch>=2.24.0",
    # Gemini verifier (System B)
    "google-genai>=0.3.0",
    # Reports
    "reportlab>=4.1.0",
    # UIs
    "streamlit>=1.32.0",
    "streamlit-drawable-canvas>=0.9.3",
]

[project.scripts]
krispin = "krispin.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["krispin*"]
