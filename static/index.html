<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הורדת סרטוני יוטיוב</title>
  <style>
    :root {
      --bg: #0f1220;
      --card: #1a1f35;
      --card2: #232a47;
      --text: #eef1ff;
      --muted: #99a2c7;
      --accent: #5b8cff;
      --accent2: #7c5bff;
      --ok: #34d399;
      --err: #f87171;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Heebo", system-ui, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, #25305c 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }
    .wrap { width: 100%; max-width: 640px; }
    .title {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin: 0 0 6px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle { text-align: center; color: var(--muted); margin: 0 0 26px; font-size: 15px; }
    .card {
      background: var(--card);
      border: 1px solid #2a3257;
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .row { display: flex; gap: 10px; }
    input[type="text"] {
      flex: 1;
      background: var(--card2);
      border: 1px solid #313a63;
      color: var(--text);
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 20px;
      color: white;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: transform .05s ease, opacity .2s ease;
      white-space: nowrap;
    }
    button:hover { opacity: .92; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hidden { display: none !important; }

    .preview { margin-top: 20px; display: flex; gap: 14px; align-items: flex-start; }
    .preview img { width: 160px; height: 90px; object-fit: cover; border-radius: 10px; flex-shrink: 0; background: #000; }
    .pv-title { font-weight: 700; font-size: 16px; line-height: 1.4; margin: 0 0 4px; }
    .pv-meta { color: var(--muted); font-size: 13px; }

    .controls { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
    select {
      width: 100%;
      background: var(--card2);
      border: 1px solid #313a63;
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }
    .download-btn { width: 100%; margin-top: 16px; padding: 16px; font-size: 16px; }

    .progress-wrap { margin-top: 20px; }
    .bar { height: 14px; background: var(--card2); border-radius: 999px; overflow: hidden; }
    .bar > div {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .3s ease;
    }
    .bar.indet > div { width: 40% !important; animation: slide 1.1s infinite linear; }
    @keyframes slide { 0% { margin-right: -40%; } 100% { margin-right: 100%; } }
    .status-line { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--muted); }
    .status-text { font-weight: 700; color: var(--text); }

    .msg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 14px; }
    .msg.err { background: rgba(248,113,113,.12); color: var(--err); border: 1px solid rgba(248,113,113,.35); }
    .msg.ok  { background: rgba(52,211,153,.12); color: var(--ok); border: 1px solid rgba(52,211,153,.35); }
    .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; line-height: 1.6; }
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid #ffffff66; border-top-color:#fff; border-radius:50%; animation: spin .7s linear infinite; vertical-align:-2px; margin-left:6px;}
    @keyframes spin { to { transform: rotate(360deg);} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">הורדת סרטוני יוטיוב</h1>
    <p class="subtitle">הדבק לינק, בחר איכות, והורד למחשב — באיכות הגבוהה ביותר</p>

    <div class="card">
      <div class="row">
        <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" />
        <button id="checkBtn">בדוק</button>
      </div>

      <div id="errBox" class="msg err hidden"></div>

      <div id="preview" class="preview hidden">
        <img id="thumb" alt="" />
        <div>
          <p id="pvTitle" class="pv-title"></p>
          <p id="pvMeta" class="pv-meta"></p>
        </div>
      </div>

      <div id="controls" class="hidden">
        <div class="controls">
          <div>
            <label for="quality">איכות</label>
            <select id="quality"></select>
          </div>
          <div>
            <label for="mode">סוג הורדה</label>
            <select id="mode">
              <option value="video">וידאו (MP4)</option>
              <option value="audio">אודיו בלבד (MP3)</option>
            </select>
          </div>
        </div>
        <button id="downloadBtn" class="download-btn">⬇ הורד</button>
      </div>

      <div id="progressWrap" class="progress-wrap hidden">
        <div id="bar" class="bar"><div></div></div>
        <div class="status-line">
          <span id="statusText" class="status-text">מתחיל…</span>
          <span id="statusInfo"></span>
        </div>
      </div>

      <div id="okBox" class="msg ok hidden"></div>
    </div>

    <p class="foot">
      מבוסס על yt-dlp + ffmpeg · ההורדה מתבצעת בשרת המקומי שלך<br/>
      הורד רק תוכן שמותר לך להוריד
    </p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const urlInput = $("url");
    const checkBtn = $("checkBtn");
    const errBox = $("errBox");
    const preview = $("preview");
    const controls = $("controls");
    const qualitySel = $("quality");
    const modeSel = $("mode");
    const downloadBtn = $("downloadBtn");
    const progressWrap = $("progressWrap");
    const bar = $("bar");
    const barInner = bar.firstElementChild;
    const statusText = $("statusText");
    const statusInfo = $("statusInfo");
    const okBox = $("okBox");

    let pollTimer = null;

    function showErr(msg) { errBox.textContent = msg; errBox.classList.remove("hidden"); }
    function hideErr() { errBox.classList.add("hidden"); }

    function fmtDuration(sec) {
      if (!sec) return "";
      sec = Math.round(sec);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const pad = (n) => String(n).padStart(2, "0");
      return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
    }
    function fmtBytes(b) {
      if (!b) return "";
      const u = ["B", "KB", "MB", "GB"];
      let i = 0;
      while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
      return `${b.toFixed(1)} ${u[i]}`;
    }
    function fmtEta(sec) {
      if (sec == null) return "";
      return `נותרו ~${fmtDuration(sec)}`;
    }

    async function checkVideo() {
      const url = urlInput.value.trim();
      if (!url) { showErr("הדבק לינק קודם"); return; }
      hideErr();
      preview.classList.add("hidden");
      controls.classList.add("hidden");
      progressWrap.classList.add("hidden");
      okBox.classList.add("hidden");
      checkBtn.disabled = true;
      checkBtn.innerHTML = 'בודק<span class="spinner"></span>';
      try {
        const res = await fetch("/api/info", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "שגיאה");

        $("thumb").src = data.thumbnail || "";
        $("pvTitle").textContent = data.title || "ללא כותרת";
        const meta = [];
        if (data.uploader) meta.push(data.uploader);
        if (data.duration) meta.push(fmtDuration(data.duration));
        $("pvMeta").textContent = meta.join(" · ");

        qualitySel.innerHTML = "";
        const best = document.createElement("option");
        best.value = "best";
        best.textContent = "האיכות המקסימלית";
        qualitySel.appendChild(best);
        (data.heights || []).forEach((h) => {
          const o = document.createElement("option");
          o.value = String(h);
          o.textContent = h >= 2160 ? `${h}p (4K)` : h >= 1440 ? `${h}p (2K)` : `${h}p`;
          qualitySel.appendChild(o);
        });

        preview.classList.remove("hidden");
        controls.classList.remove("hidden");
      } catch (e) {
        showErr(e.message);
      } finally {
        checkBtn.disabled = false;
        checkBtn.textContent = "בדוק";
      }
    }

    async function startDownload() {
      hideErr();
      okBox.classList.add("hidden");
      downloadBtn.disabled = true;
      progressWrap.classList.remove("hidden");
      bar.classList.add("indet");
      barInner.style.width = "100%";
      statusText.textContent = "מתחיל…";
      statusInfo.textContent = "";

      try {
        const res = await fetch("/api/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            url: urlInput.value.trim(),
            quality: qualitySel.value,
            mode: modeSel.value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "שגיאה");
        pollProgress(data.job_id);
      } catch (e) {
        showErr(e.message);
        downloadBtn.disabled = false;
        progressWrap.classList.add("hidden");
      }
    }

    function pollProgress(jobId) {
      clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch(`/api/progress/${jobId}`);
          const j = await res.json();
          if (!res.ok) throw new Error(j.detail || "שגיאה");

          if (j.status === "downloading") {
            if (j.percent != null) {
              bar.classList.remove("indet");
              barInner.style.width = j.percent + "%";
              statusText.textContent = `מוריד… ${j.percent}%`;
            } else {
              bar.classList.add("indet");
              statusText.textContent = "מוריד…";
            }
            const parts = [];
            if (j.speed) parts.push(fmtBytes(j.speed) + "/ש׳");
            if (j.eta != null) parts.push(fmtEta(j.eta));
            statusInfo.textContent = parts.join(" · ");
          } else if (j.status === "processing") {
            bar.classList.add("indet");
            statusText.textContent = "ממזג וידאו ואודיו…";
            statusInfo.textContent = "";
          } else if (j.status === "done") {
            clearInterval(pollTimer);
            bar.classList.remove("indet");
            barInner.style.width = "100%";
            statusText.textContent = "הושלם!";
            statusInfo.textContent = "";
            triggerDownload(jobId, j.filename);
            okBox.textContent = "ההורדה מוכנה — הקובץ נשמר אצלך 🎉";
            okBox.classList.remove("hidden");
            downloadBtn.disabled = false;
          } else if (j.status === "error") {
            clearInterval(pollTimer);
            showErr("ההורדה נכשלה: " + (j.error || ""));
            progressWrap.classList.add("hidden");
            downloadBtn.disabled = false;
          }
        } catch (e) {
          clearInterval(pollTimer);
          showErr(e.message);
          downloadBtn.disabled = false;
        }
      }, 1000);
    }

    function triggerDownload(jobId, filename) {
      const a = document.createElement("a");
      a.href = `/api/file/${jobId}`;
      if (filename) a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    checkBtn.addEventListener("click", checkVideo);
    urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") checkVideo(); });
    downloadBtn.addEventListener("click", startDownload);
  </script>
</body>
</html>
